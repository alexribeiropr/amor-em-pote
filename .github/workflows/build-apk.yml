name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Frontend Web
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Android (Debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Amor-em-Pote-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
